---
- name: Power off lab VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", destroy, "{{ lab_vm_name }}"]
  register: lab_vm_destroy
  changed_when: lab_vm_destroy.rc == 0
  failed_when: false

- name: Undefine lab VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", undefine, "{{ lab_vm_name }}", --nvram]
  register: lab_vm_undefine
  changed_when: lab_vm_undefine.rc == 0
  failed_when: false

- name: Remove VM disks and seed ISO
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lab_vm_overlay }}"
    - "{{ lab_vm_base_image }}"
    - "{{ lab_vm_seed_iso }}"
  failed_when: false

- name: Destroy management network
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", net-destroy, "{{ lab_mgmt_network_name }}"]
  register: lab_vm_net_destroy
  changed_when: lab_vm_net_destroy.rc == 0
  failed_when: false

- name: Undefine management network
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", net-undefine, "{{ lab_mgmt_network_name }}"]
  register: lab_vm_net_undefine
  changed_when: lab_vm_net_undefine.rc == 0
  failed_when: false

- name: Remove generated work directory
  ansible.builtin.file:
    path: "{{ lab_vm_work_dir }}"
    state: absent
  become: false
  failed_when: false

- name: Drop stale SSH host key for the lab VM
  ansible.builtin.command:
    argv: [ssh-keygen, -R, "{{ lab_vm_host }}"]
  become: false
  changed_when: false
  failed_when: false

- name: Remove lab VM SSH keypair
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lab_vm_ssh_key }}"
    - "{{ lab_vm_ssh_key }}.pub"
  when: lab_vm_remove_ssh_key | bool
  become: false
  failed_when: false
