---
# Create the L1 lab VM on a Linux L0 hypervisor. Darwin is operator-only.

- name: Fail when L0 is macOS
  ansible.builtin.fail:
    msg: >-
      This inventory creates the lab VM on the local machine. Darwin cannot be
      L0. Start Lima (lima/lab.yaml) and use inventory.lab-remote.yml instead.
  when: ansible_system | default('') == "Darwin"

- name: Check /dev/kvm
  ansible.builtin.stat:
    path: /dev/kvm
  register: lab_vm_kvm
  become: false

- name: Require KVM on L0
  ansible.builtin.fail:
    msg: /dev/kvm is missing on the L0 host. Enable virtualization in firmware.
  when: not lab_vm_kvm.stat.exists

- name: Read nested virtualization flag
  ansible.builtin.shell: |
    cat /sys/module/kvm_intel/parameters/nested 2>/dev/null \
      || cat /sys/module/kvm_amd/parameters/nested 2>/dev/null \
      || echo MISSING
  register: lab_vm_nested
  changed_when: false
  failed_when: false
  become: false

- name: Require nested virtualization
  ansible.builtin.assert:
    that:
      - lab_vm_nested.stdout | trim in ['Y', '1']
    fail_msg: >-
      Nested virtualization is off (nested={{ lab_vm_nested.stdout | trim }}).
      The lab VM cannot run KVM guests for sushy-tools without it.
      Intel: echo 'options kvm_intel nested=1' | sudo tee /etc/modprobe.d/kvm-intel.conf
      AMD:   echo 'options kvm_amd nested=1' | sudo tee /etc/modprobe.d/kvm-amd.conf
      Then reload the kvm module or reboot.

- name: Install L0 hypervisor packages (Fedora / RHEL)
  ansible.builtin.dnf:
    name:
      - libvirt
      - libvirt-daemon-kvm
      - libvirt-client
      - qemu-kvm
      - qemu-img
      - xorriso
      - curl
    state: present
  when: ansible_os_family == "RedHat"

- name: Install L0 hypervisor packages (Debian / Ubuntu)
  ansible.builtin.apt:
    name:
      - libvirt-daemon-system
      - libvirt-clients
      - qemu-system-x86
      - qemu-utils
      - genisoimage
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Probe system libvirt
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", version]
  register: lab_vm_virsh
  changed_when: false
  failed_when: false

- name: Start modular libvirt sockets when virsh is down
  when: lab_vm_virsh.rc != 0
  block:
    - name: Stat modular libvirt units
      ansible.builtin.stat:
        path: "/usr/lib/systemd/system/{{ item }}"
      loop: "{{ lab_vm_modular_units }}"
      register: lab_vm_mod_units

    - name: Enable modular libvirt sockets
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: started
        enabled: true
      loop: "{{ lab_vm_mod_units.results }}"
      when: item.stat.exists | default(false)
      failed_when: false

- name: Start libvirtd when still down
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true
  failed_when: false
  when: lab_vm_virsh.rc != 0

- name: Re-probe libvirt
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", version]
  register: lab_vm_virsh2
  changed_when: false
  failed_when: lab_vm_virsh2.rc != 0

- name: Resolve seed-ISO tool
  ansible.builtin.shell: |
    for c in xorriso genisoimage mkisofs; do
      command -v "$c" && exit 0
    done
    exit 1
  register: lab_vm_seed_tool
  changed_when: false

- name: Record seed-ISO tool
  ansible.builtin.set_fact:
    lab_vm_seed_iso_tool: "{{ lab_vm_seed_tool.stdout_lines[0] | basename }}"

- name: Ensure SSH key directory exists
  ansible.builtin.file:
    path: "{{ lab_vm_ssh_key | dirname }}"
    state: directory
    mode: "0700"
  become: false

- name: Create lab VM SSH key if missing
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -f
      - "{{ lab_vm_ssh_key }}"
      - -N
      - ""
      - -C
      - ironic-lab-vm
    creates: "{{ lab_vm_ssh_key }}"
  become: false

- name: Read lab VM public key
  ansible.builtin.slurp:
    src: "{{ lab_vm_ssh_key }}.pub"
  register: lab_vm_pubkey_b64
  become: false

- name: Set lab_vm_pubkey
  ansible.builtin.set_fact:
    lab_vm_pubkey: "{{ lab_vm_pubkey_b64.content | b64decode | trim }}"

- name: Ensure work directory exists
  ansible.builtin.file:
    path: "{{ lab_vm_work_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure libvirt images directory exists
  ansible.builtin.file:
    path: "{{ lab_vm_base_image | dirname }}"
    state: directory

- name: Render management network XML
  ansible.builtin.template:
    src: mgmt-network.xml.j2
    dest: "{{ lab_vm_work_dir }}/mgmt-network.xml"
    mode: "0644"
  become: false

- name: Define management network
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", net-define, "{{ lab_vm_work_dir }}/mgmt-network.xml"]
  register: lab_vm_net_define
  changed_when: "'defined' in ((lab_vm_net_define.stdout ~ lab_vm_net_define.stderr) | lower)"
  failed_when: >-
    lab_vm_net_define.rc != 0
    and 'already exists' not in ((lab_vm_net_define.stdout ~ lab_vm_net_define.stderr) | lower)

- name: Start management network
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", net-start, "{{ lab_mgmt_network_name }}"]
  register: lab_vm_net_start
  changed_when: "'started' in ((lab_vm_net_start.stdout ~ lab_vm_net_start.stderr) | lower)"
  failed_when: >-
    lab_vm_net_start.rc != 0
    and 'already active' not in ((lab_vm_net_start.stdout ~ lab_vm_net_start.stderr) | lower)

- name: Autostart management network
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", net-autostart, "{{ lab_mgmt_network_name }}"]
  changed_when: false
  failed_when: false

- name: Configure L0 firewall for the management bridge
  ansible.builtin.include_tasks: firewall.yml

- name: Download Ubuntu cloud image
  ansible.builtin.get_url:
    url: "{{ lab_vm_base_image_url }}"
    dest: "{{ lab_vm_base_image }}"
    mode: "0644"
    timeout: 600

- name: Stat overlay disk
  ansible.builtin.stat:
    path: "{{ lab_vm_overlay }}"
  register: lab_vm_overlay_stat

- name: Create overlay disk
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - -F
      - qcow2
      - -b
      - "{{ lab_vm_base_image }}"
      - "{{ lab_vm_overlay }}"
      - "{{ lab_vm_disk_size }}"
  when: not lab_vm_overlay_stat.stat.exists
  changed_when: true

- name: Render cloud-init files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ lab_vm_work_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: user-data.j2, dest: user-data }
    - { src: meta-data.j2, dest: meta-data }
    - { src: network-config.j2, dest: network-config }
  become: false

- name: Build cloud-init seed ISO
  ansible.builtin.command:
    argv: "{{ lab_vm_seed_iso_cmd }}"
  vars:
    lab_vm_seed_iso_cmd: >-
      {{
        ['xorriso', '-as', 'mkisofs', '-output', lab_vm_seed_iso, '-volid', 'cidata',
         '-joliet', '-rock',
         lab_vm_work_dir + '/user-data',
         lab_vm_work_dir + '/meta-data',
         lab_vm_work_dir + '/network-config']
        if lab_vm_seed_iso_tool == 'xorriso'
        else
        [lab_vm_seed_iso_tool, '-output', lab_vm_seed_iso, '-volid', 'cidata',
         '-joliet', '-rock',
         lab_vm_work_dir + '/user-data',
         lab_vm_work_dir + '/meta-data',
         lab_vm_work_dir + '/network-config']
      }}
  changed_when: true

- name: Render VM domain XML
  ansible.builtin.template:
    src: vm-domain.xml.j2
    dest: "{{ lab_vm_work_dir }}/vm-domain.xml"
    mode: "0644"
  become: false

- name: Define lab VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", define, "{{ lab_vm_work_dir }}/vm-domain.xml"]
  register: lab_vm_define
  changed_when: "'defined' in ((lab_vm_define.stdout ~ lab_vm_define.stderr) | lower)"
  failed_when: >-
    lab_vm_define.rc != 0
    and 'already exists' not in ((lab_vm_define.stdout ~ lab_vm_define.stderr) | lower)

- name: Start lab VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", start, "{{ lab_vm_name }}"]
  register: lab_vm_start
  changed_when: "'started' in ((lab_vm_start.stdout ~ lab_vm_start.stderr) | lower)"
  failed_when: >-
    lab_vm_start.rc != 0
    and 'already active' not in ((lab_vm_start.stdout ~ lab_vm_start.stderr) | lower)

- name: Autostart lab VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ lab_libvirt_uri }}", autostart, "{{ lab_vm_name }}"]
  changed_when: false
  failed_when: false
