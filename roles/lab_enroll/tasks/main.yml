---
# Create one Ironic node per sushy System. Redfish address is the lab
# gateway so the conductor container can reach host-networked sushy.
# Ironic defaults to microversion 1.1, which rejects ?detail= and most
# driver_info fields. Pin a current version on every call.

- name: Wait for Ironic API
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ ironic_api_port | default(6385) }}/v1/nodes"
    url_username: "{{ ironic_admin_username }}"
    url_password: "{{ ironic_admin_password }}"
    force_basic_auth: true
    headers:
      X-OpenStack-Ironic-API-Version: "1.91"
    method: GET
    status_code: 200
  register: lab_ironic_ready
  until: lab_ironic_ready.status == 200
  retries: 30
  delay: 4

- name: List existing Ironic nodes
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ ironic_api_port | default(6385) }}/v1/nodes?detail=true"
    url_username: "{{ ironic_admin_username }}"
    url_password: "{{ ironic_admin_password }}"
    force_basic_auth: true
    headers:
      X-OpenStack-Ironic-API-Version: "1.91"
    method: GET
    status_code: 200
  register: lab_ironic_nodes

- name: List Redfish systems
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ lab_sushy_port }}/redfish/v1/Systems"
    url_username: "{{ lab_bmc_username }}"
    url_password: "{{ lab_bmc_password }}"
    force_basic_auth: true
    method: GET
    status_code: 200
  register: lab_redfish_systems

- name: Fetch each Redfish system
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ lab_sushy_port }}{{ item['@odata.id'] }}"
    url_username: "{{ lab_bmc_username }}"
    url_password: "{{ lab_bmc_password }}"
    force_basic_auth: true
    method: GET
    status_code: 200
  loop: "{{ lab_redfish_systems.json.Members }}"
  loop_control:
    label: "{{ item['@odata.id'] }}"
  register: lab_redfish_system_details

- name: Build enroll map (Name -> system id)
  ansible.builtin.set_fact:
    lab_enroll_systems: >-
      {{
        lab_redfish_system_details.results
        | map(attribute='json')
        | list
      }}

- name: Existing Ironic node names
  ansible.builtin.set_fact:
    lab_existing_node_names: "{{ lab_ironic_nodes.json.nodes | map(attribute='name') | list }}"

- name: Create missing Ironic nodes
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ ironic_api_port | default(6385) }}/v1/nodes"
    url_username: "{{ ironic_admin_username }}"
    url_password: "{{ ironic_admin_password }}"
    force_basic_auth: true
    headers:
      X-OpenStack-Ironic-API-Version: "1.91"
    method: POST
    status_code: [201, 409]
    body_format: json
    body:
      name: "{{ item.Name }}"
      driver: redfish
      boot_interface: redfish-virtual-media
      deploy_interface: direct
      inspect_interface: redfish
      network_interface: "noop"
      management_interface: redfish
      power_interface: redfish
      driver_info:
        redfish_address: "http://{{ lab_network_gateway }}:{{ lab_sushy_port }}"
        redfish_system_id: "{{ item['@odata.id'] }}"
        redfish_username: "{{ lab_bmc_username }}"
        redfish_password: "{{ lab_bmc_password }}"
        redfish_verify_ca: false
  loop: "{{ lab_enroll_systems }}"
  loop_control:
    label: "{{ item.Name }}"
  when:
    - item.Name in (lab_bmc_nodes | map(attribute='name') | list)
    - item.Name not in lab_existing_node_names
  register: lab_node_create

- name: Refresh Ironic node list
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ ironic_api_port | default(6385) }}/v1/nodes?detail=true"
    url_username: "{{ ironic_admin_username }}"
    url_password: "{{ ironic_admin_password }}"
    force_basic_auth: true
    headers:
      X-OpenStack-Ironic-API-Version: "1.91"
    method: GET
    status_code: 200
  register: lab_ironic_nodes_after

- name: Move enrollable nodes to manageable
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ ironic_api_port | default(6385) }}/v1/nodes/{{ item.name }}/states/provision"
    url_username: "{{ ironic_admin_username }}"
    url_password: "{{ ironic_admin_password }}"
    force_basic_auth: true
    headers:
      X-OpenStack-Ironic-API-Version: "1.91"
    method: PUT
    status_code: [202, 409]
    body_format: json
    body:
      target: manage
  loop: "{{ lab_bmc_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: lab_node_manage

- name: Wait until enrolled nodes are manageable
  ansible.builtin.uri:
    url: "http://{{ lab_service_host }}:{{ ironic_api_port | default(6385) }}/v1/nodes/{{ item.name }}"
    url_username: "{{ ironic_admin_username }}"
    url_password: "{{ ironic_admin_password }}"
    force_basic_auth: true
    headers:
      X-OpenStack-Ironic-API-Version: "1.91"
    method: GET
    status_code: 200
  loop: "{{ lab_bmc_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: lab_node_wait
  until: lab_node_wait.json.provision_state in ["manageable", "available", "active"]
  retries: 30
  delay: 4

- name: Show enrolled nodes
  ansible.builtin.debug:
    msg: |
      Enrolled in Ironic (Redfish virtual media, noop network, direct deploy):
      {% for res in lab_node_wait.results %}
      - {{ res.item.name }}  {{ res.json.uuid }}  {{ res.json.provision_state }}
      {% endfor %}

      Next:
        ironic-cli node list
        ironic-cli node show lab-node-1
      A full IPA deploy is not part of smoke.yml; see the README.
