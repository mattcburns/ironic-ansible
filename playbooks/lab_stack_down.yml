---
# Clean sushy + nested guests inside a still-running lab VM.

- name: Tear down sushy and nested guests
  hosts: lab
  gather_facts: true
  become: true
  ignore_unreachable: true
  environment:
    LIBVIRT_DEFAULT_URI: "{{ lab_libvirt_uri }}"
  tasks:
    - name: Stop sushy-tools
      ansible.builtin.shell: |
        set -e
        if [ -f {{ lab_sushy_dir }}/docker-compose.sushy.yml ]; then
          {{ lab_compose_shell | default('docker compose') }} \
            -f {{ lab_sushy_dir }}/docker-compose.sushy.yml down || true
        fi
        docker rm -f ironic-sushy-tools >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      failed_when: false
      tags: [sushy]

    - name: Destroy nested BMC nodes
      ansible.builtin.shell: |
        set -e
        for node in {{ lab_bmc_nodes | map(attribute='name') | join(' ') }}; do
          virsh destroy "$node" || true
          virsh undefine "$node" --remove-all-storage || true
        done
      args:
        executable: /bin/bash
      failed_when: false
      tags: [libvirt]

    - name: Destroy nested lab network
      ansible.builtin.shell: |
        virsh net-destroy {{ lab_network_name }} || true
        virsh net-undefine {{ lab_network_name }} || true
      args:
        executable: /bin/bash
      failed_when: false
      tags: [libvirt]

    - name: Remove lab infra directory
      ansible.builtin.file:
        path: "{{ lab_infra_dir }}"
        state: absent
      tags: [cleanup]
