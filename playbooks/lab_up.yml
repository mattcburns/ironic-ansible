---
# Two-tier lab:
#   Linux + inventory.lab.yml:        create the VM, then deploy into it
#   inventory.lab-remote.yml (macOS): deploy into a VM you already have
#
#   ansible-playbook -i inventory.lab.yml playbooks/lab_up.yml --ask-become-pass

- ansible.builtin.import_playbook: lab_vm_provision.yml
  when: "'vm_l0' in groups"

- name: Wait for a playbook-created lab VM
  hosts: lab
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600
        delay: 5
      when: "'vm_l0' in groups"

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: lab_vm_cloud_init
      changed_when: false
      # rc 0 = done, 1 = done with errors, 2 = done degraded. Packages are
      # installed by lab_prereqs; do not fail the wait on a cloud-init warning.
      failed_when: false
      become: true
      when: "'vm_l0' in groups"

    - name: Gather facts from the lab VM
      ansible.builtin.setup:
      when: "'vm_l0' in groups"

- name: Bring up lab host (libvirt + sushy)
  hosts: lab
  gather_facts: true
  become: true
  environment:
    LIBVIRT_DEFAULT_URI: "{{ lab_libvirt_uri }}"

  pre_tasks:
    - name: Check /dev/kvm
      ansible.builtin.stat:
        path: /dev/kvm
      register: lab_kvm

    - name: Fail if KVM is unavailable
      ansible.builtin.fail:
        msg: >-
          /dev/kvm is missing inside the lab VM. On Linux L0, enable nested
          virtualization. On macOS, use lima/lab.yaml (vmType: vz,
          nestedVirtualization: true) on macOS 15+ with Apple Silicon M3 or
          later (M5 Pro included) or a recent Intel Mac. See lima/README.md.
      when: not lab_kvm.stat.exists

    - name: Read total memory (MiB)
      ansible.builtin.command: awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo
      register: lab_mem_mib
      changed_when: false

    - name: Require at least 8 GiB RAM in the lab VM
      ansible.builtin.assert:
        that:
          - lab_mem_mib.stdout | int >= 8192
        fail_msg: "Lab VM needs >= 8 GiB RAM, found {{ lab_mem_mib.stdout }} MiB."

  roles:
    - role: lab_prereqs
      tags: [prereqs]
    - role: lab_firewall
      tags: [firewall]
    - role: lab_libvirt
      tags: [libvirt]
    - role: lab_sushy
      tags: [sushy]

  post_tasks:
    - name: Show lab endpoints
      ansible.builtin.debug:
        msg: |
          Lab is up inside {{ inventory_hostname }} ({{ ansible_host }}).

          From the operator:
          - Ironic API: http://{{ ansible_host }}:{{ ironic_api_port | default(6385) }}
          - Redfish:    http://{{ ansible_host }}:{{ lab_sushy_port }}/redfish/v1
          BMC user: {{ lab_bmc_username }}

          Inside the lab VM, nodes reach Ironic HTTP at
          http://{{ lab_network_gateway }}:{{ ironic_http_port | default(6180) }}

          Nodes:
          {% for node in lab_bmc_nodes %}
          - {{ node.name }}  {{ node.ip }}
          {% endfor %}

- ansible.builtin.import_playbook: deploy.yml

- ansible.builtin.import_playbook: enroll.yml

- name: Export the lab OpenStack cloud profile to the repo
  hosts: lab
  gather_facts: false
  tasks:
    - name: Fetch lab clouds.yaml into the repo
      ansible.builtin.fetch:
        src: "{{ ironic_clouds_yaml_path }}"
        dest: "{{ lab_local_clouds_yaml_path }}"
        flat: true
        mode: "0600"
      become: true
      no_log: true
      when: (ironic_clouds_yaml_enabled | bool) and (lab_export_clouds_yaml | bool)

    - name: Restrict local cloud profile permissions
      ansible.builtin.file:
        path: "{{ lab_local_clouds_yaml_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: (ironic_clouds_yaml_enabled | bool) and (lab_export_clouds_yaml | bool)

    - name: Show local cloud profile path
      ansible.builtin.debug:
        msg: >-
          {{ ('Wrote lab cloud profile to ' ~ lab_local_clouds_yaml_path ~
              ' -- try: OS_CLIENT_CONFIG_FILE=' ~ lab_local_clouds_yaml_path ~
              ' openstack --os-cloud ' ~ ironic_cloud_name ~ ' baremetal node list')
             if ((ironic_clouds_yaml_enabled | bool) and (lab_export_clouds_yaml | bool))
             else 'Skipped local clouds.yaml export (ironic_clouds_yaml_enabled or lab_export_clouds_yaml is false)' }}
