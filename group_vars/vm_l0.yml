---
# Applied only when the operator host is in vm_l0 (inventory.lab.yml).
# This is the Linux hypervisor that *creates* the lab VM.

lab_vm_name: ironic-lab
lab_vm_user: lab
lab_vm_host: 192.168.126.100
lab_vm_ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/ironic_lab_vm"
lab_vm_memory: 16384
lab_vm_cpus: 8
lab_vm_disk_size: 80G
lab_vm_mac: "52:54:00:5a:00:64"
lab_vm_base_image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img

lab_mgmt_network_name: ironic-mgmt-net
lab_mgmt_network: 192.168.126.0/24
lab_mgmt_network_gateway: 192.168.126.1
lab_mgmt_network_bridge: ironicmgmt0
lab_mgmt_network_dhcp_start: 192.168.126.200
lab_mgmt_network_dhcp_end: 192.168.126.254
